name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.os }}
    steps:
      # - uses: holepunchto/actions/node-base@v1
      # - run: npm test
      - uses: holepunchto/actions/bare-base@v1
      - shell: bash
        run: |
          for i in $(seq 1 100); do
            echo "::group::run $i"
            npm run test:bare
            echo "::endgroup::"
          done
