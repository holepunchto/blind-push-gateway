name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.os }}
    steps:
      - uses: twingate/github-action@f1e69fc5af67b737d8597b759e5c607f567e77f2 # v1.8
        if: runner.os != 'macOS'
        with:
          service-key: ${{ secrets.TEST_KEY }}
      - uses: holepunchto/actions/bare-base@v1
      - shell: bash
        run: |
          for i in $(seq 1 100); do
            echo "::group::run $i"
            npm t
            npm run test:bare
            echo "::endgroup::"
          done
